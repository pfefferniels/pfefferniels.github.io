<style>
  /* What the Slides renderer assumes before the deck's own rules: a 1920×1080 canvas, no margins, cover-fitted images. */
  .canvas { width: 1920px; height: 1080px; transform-origin: 0 0; line-height: 1.2; text-align: left; }
  .canvas section { width: 1920px; height: 1080px; position: relative; overflow: hidden; margin: 0; }
  .canvas section[data-flat], .canvas section[data-flat] * { box-sizing: border-box; }
  :where(.canvas) :where(h1, h2, h3, p) { margin: 0; position: relative; z-index: 1; }
  :where(.canvas) h1 { font-size: 96px; font-weight: 600; }
  :where(.canvas) h2 { font-size: 64px; font-weight: 600; }
  :where(.canvas) h3 { font-size: 44px; font-weight: 600; }
  :where(.canvas) p { font-size: 32px; font-weight: 400; }
  :where(.canvas) img { display: block; object-fit: cover; }
  :where(.canvas) aside { display: none; }
  .canvas .crop { position: relative; overflow: hidden; }
  .canvas .crop > img { position: absolute; max-width: none; max-height: none; object-fit: cover; }
</style>
<style>
/* Catalogue of examples: white page, the music is the content; text stays small and gray around it. */
:root {
  --ink: #1F2328;
  --soft: #4B5563;
  --muted: #6B7280;
  --rule: #E5E7EB;
  --wash: #F3F4F6;
  --paper: #FFFFFF;
  --accent: #2F5D8A;
  --accent-wash: #E8EEF5;
  --warn: #8A5A00;
  --warn-wash: #FBF1DE;
  --display: 'EB Garamond', Georgia, serif;
  --text: 'Public Sans', Arial, sans-serif;
}

.canvas { font-family: var(--text); color: var(--ink); }

.canvas section { background: var(--paper); padding: 96px 120px 88px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; }

.canvas h1, .canvas h2, .canvas h3 { font-family: var(--display); color: var(--ink); font-weight: 600; }

.eyebrow { font-family: var(--text); font-size: 24px; font-weight: 600; color: var(--accent); letter-spacing: 1px; }

/* Cover */
.cover { justify-content: center; gap: 40px; }
.cover h1 { font-size: 132px; line-height: 1.0; }
.cover .lede { font-size: 36px; color: var(--soft); width: 1300px; line-height: 1.35; }
.cover .meta { font-size: 26px; color: var(--muted); }

/* Section divider for a group of techniques */
.group { background: var(--wash); justify-content: center; gap: 32px; }
.group h2 { font-size: 96px; line-height: 1.05; }
.group .lede { font-size: 34px; color: var(--soft); width: 1400px; line-height: 1.4; }

/* Technique card */
.technique h2 { font-size: 72px; line-height: 1.05; }
.technique .definition { font-size: 34px; color: var(--soft); width: 1500px; line-height: 1.4; }
.technique table { font-size: 26px; color: var(--ink); width: 1680px; }

/* Instance slide */
.instance { gap: 18px; }
.instance .head { display: flex; flex-direction: column; gap: 6px; }
.instance h2 { font-size: 48px; line-height: 1.1; }
.instance .score { width: 1680px; height: 560px; object-fit: contain; }
.instance .pair { display: flex; flex-direction: column; gap: 10px; }
.instance .pair .label { font-size: 24px; font-weight: 600; color: var(--muted); }
.instance .pair img { width: 1680px; height: 290px; object-fit: contain; }
.instance .caption { font-size: 28px; line-height: 1.4; color: var(--ink); width: 1680px; }
.instance .foot { display: flex; flex-direction: row; gap: 16px; align-items: center; }
.instance .foot .src { font-size: 24px; color: var(--muted); }
.instance .side { display: flex; flex-direction: row; gap: 40px; align-items: flex-start; }
.instance .stack { display: flex; flex-direction: column; gap: 8px; }
.instance .col { display: flex; flex-direction: column; gap: 6px; }
.instance .lbl { font-size: 24px; font-weight: 600; color: var(--muted); }
.instance .col img { object-fit: contain; }
.tag { font-size: 24px; padding: 4px 14px; border-radius: 8px; background: var(--accent-wash); color: var(--accent); }
.tag.caution { background: var(--warn-wash); color: var(--warn); }

/* Overview tables */
.overview h2 { font-size: 64px; }
.overview table { font-size: 26px; color: var(--ink); width: 1680px; }
.overview .note { font-size: 24px; color: var(--muted); width: 1680px; line-height: 1.4; }

</style>
<style>
  :root {
    --page-bg: #ffffff; --page-fg: #111827; --page-muted: #6b7280; --page-line: #e5e7eb; --page-hover: #f3f4f6;

  html, body { margin: 0; }
  body {
    background: var(--page-bg); color: var(--page-fg);

  [hidden] { display: none !important; }

  .top { max-width: var(--page-w); margin: 0 auto 8px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 20px; }
  .top h1 { flex: 1 1 auto; margin: 0; font: 600 2rem/1.15 'EB Garamond', Georgia, serif; color: var(--page-fg); }
  .back { order: -1; flex-basis: 100%; color: var(--page-muted); font-size: 0.95rem; text-decoration: none; }
  .back:hover { color: var(--page-fg); text-decoration: underline; text-underline-offset: 0.18em; }
  .present { all: unset; cursor: pointer; font-size: 0.95rem; padding: 4px 12px; border: 1px solid var(--page-line); border-radius: 6px; }
  .present:hover { background: var(--page-hover); }
  .present:focus-visible, .back:focus-visible, .frame:focus-visible { outline: 2px solid var(--page-fg); outline-offset: 3px; }

  main { max-width: var(--page-w); margin: 0 auto; display: grid; gap: 22px; }
  .part { margin: 26px 0 -8px; font: 600 1.35rem/1.25 'EB Garamond', Georgia, serif; color: var(--page-fg); }
  .frame { margin: 0; display: grid; gap: 4px; cursor: pointer; border-radius: 4px; }
  .screen { aspect-ratio: 16 / 9; overflow: hidden; background: #ffffff; border: 1px solid var(--page-line); border-radius: 4px; }
  .screen > .canvas { transform: scale(var(--s)); }
  .frame:hover .screen { border-color: var(--page-muted); }
  figcaption { justify-self: end; font-size: 0.8rem; color: var(--page-muted); font-variant-numeric: tabular-nums; }

  .stage { position: fixed; inset: 0; z-index: 10; background: var(--page-bg); display: grid; place-items: center; outline: none; }
  .stage-screen { width: calc(1920px * var(--stage-s)); height: calc(1080px * var(--stage-s)); overflow: hidden; background: #ffffff; }
  .stage-screen > .canvas { transform: scale(var(--stage-s)); }
  .stage-bar {
    position: fixed; right: 16px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: 4px; padding: 4px 6px;
    background: var(--page-bg); border: 1px solid var(--page-line); border-radius: 8px;
    font-size: 0.85rem; color: var(--page-muted); font-variant-numeric: tabular-nums;
    opacity: 0; transition: opacity 0.2s;
  }
  .stage.awake .stage-bar, .stage-bar:focus-within { opacity: 1; }
  .stage-bar button { all: unset; cursor: pointer; padding: 2px 8px; border-radius: 4px; color: var(--page-fg); font-size: 1.05rem; line-height: 1; }
  .stage-bar button:hover { background: var(--page-hover); }
  .stage-bar button:focus-visible { outline: 2px solid var(--page-fg); }
  #count { padding: 0 4px; min-width: 4.5em; text-align: center; }

  @media print {
    body { padding: 0; }
    .top .present, .part, figcaption { display: none; }
    .frame { break-inside: avoid; }
  }
</style>

<div class="stage" id="stage" tabindex="-1" hidden>
  <div class="stage-screen"><div class="canvas" id="stage-canvas"></div></div>
  <div class="stage-bar">
    <button id="prev" aria-label="Vorige Folie">‹</button>
    <span id="count"></span>
    <button id="next" aria-label="Nächste Folie">›</button>
    <button id="close" aria-label="Präsentation beenden">×</button>
  </div>
</div>
<script>
const W = 1920, H = 1080;
const root = document.documentElement;
const frames = [...document.querySelectorAll('.frame')];
const stage = document.getElementById('stage');
const stageCanvas = document.getElementById('stage-canvas');
const count = document.getElementById('count');
const STEPS = { ArrowRight: 1, ArrowDown: 1, PageDown: 1, ' ': 1, Enter: 1, ArrowLeft: -1, ArrowUp: -1, PageUp: -1, Backspace: -1 };

const fitList = () => root.style.setProperty('--s', frames[0].querySelector('.screen').clientWidth / W);
const fitStage = () => root.style.setProperty('--stage-s', Math.min(innerWidth / W, innerHeight / H));
const clamp = i => Math.max(0, Math.min(frames.length - 1, i));
const frameIndex = id => frames.findIndex(f => f.dataset.id === id);
const firstVisible = () => Math.max(0, frames.findIndex(f => f.getBoundingClientRect().bottom > 80));

// The stage shows a copy of the slide; its ids stay unique on the page.
function withoutIds(node) {
  node.removeAttribute('id');
  node.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));
  return node;
}

const state = { current: 0, idle: 0 };

function show(i) {
  state.current = clamp(i);
  stageCanvas.replaceChildren(withoutIds(frames[state.current].querySelector('section').cloneNode(true)));
  count.textContent = `${state.current + 1} / ${frames.length}`;
  history.replaceState(null, '', `#${frames[state.current].dataset.id}`);
}

function present(i) {
  fitStage();
  stage.hidden = false;
  show(i);
  stage.focus();
  stage.requestFullscreen?.().catch(() => {});
}

function closeStage() {
  if (stage.hidden) return;
  stage.hidden = true;
  if (document.fullscreenElement) document.exitFullscreen();
  frames[state.current].scrollIntoView({ block: 'center' });
  frames[state.current].focus({ preventScroll: true });
}

function wake() {
  stage.classList.add('awake');
  clearTimeout(state.idle);
  state.idle = setTimeout(() => stage.classList.remove('awake'), 1800);
}

function onKey(e) {
  if (stage.hidden) {
    const frame = e.target.closest?.('.frame');
    if (frame && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); present(frames.indexOf(frame)); }
    return;
  }
  if (e.key === 'Escape') return closeStage();
  if (e.key === 'Home' || e.key === 'End') { e.preventDefault(); return show(e.key === 'Home' ? 0 : frames.length - 1); }
  if (STEPS[e.key]) { e.preventDefault(); show(state.current + STEPS[e.key]); }
}

function swipe(el, onStep) {
  const start = { x: 0 };
  el.addEventListener('pointerdown', e => { start.x = e.clientX; });
  el.addEventListener('pointerup', e => {
    const dx = e.clientX - start.x;
    onStep(Math.abs(dx) > 40 ? (dx < 0 ? 1 : -1) : 1);
  });
}

frames.forEach((f, i) => f.addEventListener('click', () => present(i)));
document.getElementById('present').addEventListener('click', () => present(firstVisible()));
document.getElementById('prev').addEventListener('click', () => show(state.current - 1));
document.getElementById('next').addEventListener('click', () => show(state.current + 1));
document.getElementById('close').addEventListener('click', closeStage);
swipe(stage.querySelector('.stage-screen'), step => show(state.current + step));
stage.addEventListener('pointermove', wake);
document.addEventListener('keydown', onKey);
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) closeStage(); });
addEventListener('resize', () => { fitList(); fitStage(); });
new ResizeObserver(fitList).observe(document.querySelector('main'));

fitList();
if (frameIndex(location.hash.slice(1)) >= 0) frames[frameIndex(location.hash.slice(1))].scrollIntoView();
</script>
