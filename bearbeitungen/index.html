<style>
  /* One year axis; each Vorlage is a single hairline with a dot per arrangement. */
  :root {
    --bg: #ffffff;
    --fg: #111827;
    --muted: #6b7280;
    --line: #d1d5db;
    --grid: #f3f4f6;
    --rule: #e5e7eb;
    --shadow: rgba(17, 24, 39, 0.10);
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --fg: #e5e7eb; --muted: #9ca3af; --line: #3a3f48; --grid: #181b21; --rule: #2a2d34;
      --shadow: rgba(0, 0, 0, 0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --fg: #e5e7eb; --muted: #9ca3af; --line: #3a3f48; --grid: #181b21; --rule: #2a2d34;
    --shadow: rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font: 1rem/1.45 var(--serif);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px;
  }

  .stage { overflow-x: auto; }
  #chart { display: block; width: 100%; min-width: 980px; height: auto; }

  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--line); stroke-width: 1; }
  .tick { font-size: 11px; fill: var(--muted); text-anchor: middle; font-variant-numeric: tabular-nums; }

  .strand { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .title { font-size: 15px; fill: var(--fg); }

  .dot { cursor: pointer; outline: none; }
  .dot circle { fill: var(--bg); stroke: var(--muted); stroke-width: 1.4; }
  .dot.source circle { fill: var(--fg); stroke: var(--fg); }
  .dot text { font-size: 12.5px; fill: var(--muted); }
  .dot.source text { fill: var(--fg); }
  .dot .hit { fill: transparent; stroke: none; }
  .dot:hover text, .dot.selected text { fill: var(--fg); text-decoration: underline; text-underline-offset: 2px; }
  .dot:focus-visible circle { stroke: var(--fg); stroke-width: 2.4; }

  .card {
    position: fixed; z-index: 5;
    right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: min(24rem, calc(100vw - 32px)); max-height: min(70vh, 34rem); overflow: auto;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 10px 28px var(--shadow);
    padding: 0.9rem 1rem 1rem; display: grid; gap: 0.7rem;
  }
  .card[hidden] { display: none; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .card h2 { margin: 0; font: 600 1.05rem/1.3 var(--serif); text-wrap: balance; }
  .card .year { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
  .entry { display: grid; gap: 0.25rem; }
  .entry p { margin: 0; font-size: 0.95rem; }
  .entry ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.15rem; font-size: 0.9rem; }
  .entry .kind { color: var(--muted); }
  .entry .empty { color: var(--muted); font-size: 0.9rem; }
  .card a { color: var(--fg); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 0.18em; }
  .card a:hover { text-decoration-color: var(--fg); }
  .card a:focus-visible, .close:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .close { all: unset; cursor: pointer; font: 1.3rem/1 var(--serif); color: var(--muted); padding: 0 0.2rem; }
  .close:hover { color: var(--fg); }
  @media (max-width: 34rem) { .card { left: max(16px, env(safe-area-inset-left, 0px)); width: auto; } }
</style>

/* ---------- axis: 1600–1650 and 1680–1730 get more room, the empty decades between them almost none ---------- */

const AXIS = { rates: [[1530, 5], [1600, 8.5], [1652, 1.1], [1678, 8.5]], end: 1738 };
const DECADES = [...range(13).map(k => 1530 + k * 10), ...range(6).map(k => 1680 + k * 10)];
const GEO = { left: 22, top: 30, titleH: 24, labelDy: 18, tierH: 15, rowGap: 16, groupGap: 22, gap: 9 };

function range(n) { return Array.from({ length: n }, (_, i) => i); }
const xOfYear = y => GEO.left + AXIS.rates.reduce((x, [from, px], k) =>
  x + Math.max(0, Math.min(y, AXIS.rates[k + 1]?.[0] ?? Infinity) - from) * px, 0);

/* ---------- text ---------- */

const escapeHtml = s => s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const segments = s => s.split('*').map((t, k) => ({ t, italic: k % 2 === 1 })).filter(x => x.t);
const richText = s => segments(s).map(x => x.italic ? `<i>${escapeHtml(x.t)}</i>` : escapeHtml(x.t)).join('');
const plainText = s => s.replaceAll('*', '');

async function labelMeasure() {
  await Promise.all(['12.5px "Source Serif 4"', 'italic 12.5px "Source Serif 4"'].map(f => document.fonts.load(f).catch(() => null)));
  const ctx = document.createElement('canvas').getContext('2d');
  return s => segments(s).reduce((w, x) => {
    ctx.font = `${x.italic ? 'italic ' : ''}12.5px "Source Serif 4", Georgia, serif`;
    return w + ctx.measureText(x.t).width;
  }, 0);
}

/* ---------- layout ---------- */

// Each label takes the highest tier below its line where it clears the labels already there.
function assignTiers(dots) {
  return dots.reduce(({ ends, placed }, d) => {
    const free = ends.findIndex(end => end + GEO.gap <= d.x - d.w / 2);
    const tier = free === -1 ? ends.length : free;
    return { ends: ends.map((e, k) => k === tier ? d.x + d.w / 2 : e).concat(tier === ends.length ? [d.x + d.w / 2] : []),
      placed: [...placed, { ...d, tier }] };
  }, { ends: [], placed: [] }).placed;
}

function layoutStrand(strand, top, measure, today) {
  const dots = assignTiers(strand.dots
    .map(d => ({ ...d, x: xOfYear(d.year), w: measure(d.label) }))
    .sort((a, b) => a.x - b.x));
  const tiers = Math.max(...dots.map(d => d.tier)) + 1;
  return { ...strand, today, y: top + GEO.titleH, dots, bottom: top + GEO.titleH + GEO.labelDy + (tiers - 1) * GEO.tierH + GEO.rowGap };
}

// A group's strands run on into one shared arrangement, placed midway between its first and last line.
function layoutGroup(group, top, measure, today) {
  const rows = group.rows.reduce((done, s) =>
    [...done, layoutStrand(s, done.at(-1)?.bottom ?? top, measure, today)], []);
  const join = { ...group.join, x: xOfYear(group.join.year), y: (rows[0].y + rows.at(-1).y) / 2, w: measure(group.join.label) };
  return rows.map(row => ({ ...row, join }));
}

const layoutItem = (item, top, measure, today) =>
  item.rows ? layoutGroup(item, top, measure, today) : [layoutStrand(item, top, measure, today)];

function layoutAll(measure) {
  const stack = (items, start, today) => items.reduce((done, item) =>
    [...done, ...layoutItem(item, done.at(-1)?.bottom ?? start, measure, today)], []);
  const past = stack(STRANDS, GEO.top, false);
  const today = stack(TODAY, past.at(-1).bottom + GEO.groupGap, true);
  const rows = [...past, ...today];
  const labelEnds = rows.flatMap(r => r.dots.map(d => d.x + d.w / 2 + GEO.left));
  return { rows, joins: [...new Set(rows.map(r => r.join).filter(Boolean))],
    width: Math.max(xOfYear(AXIS.end), ...labelEnds), height: today.at(-1).bottom };
}

/* ---------- rendering ---------- */

const SVG_NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs, parent) {
  const el = document.createElementNS(SVG_NS, tag);
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  parent?.appendChild(el);
  return el;
}
function richSpans(text, s) {
  segments(s).forEach(x => { svgEl('tspan', x.italic ? { 'font-style': 'italic' } : {}, text).textContent = x.t; });
  return text;
}
const f1 = v => v.toFixed(1);
const yearOf = d => d.yearLabel ?? String(d.year);
const entriesOf = d => d.entries ?? [d];

function drawAxis(svg, layout) {
  const g = svgEl('g', { 'aria-hidden': 'true' }, svg);
  DECADES.forEach(year => {
    const x = f1(xOfYear(year));
    svgEl('line', { class: 'grid', x1: x, x2: x, y1: GEO.top - 6, y2: layout.height }, g);
    svgEl('text', { class: 'tick', x, y: GEO.top - 12 }, g).textContent = year;
  });
  [[1530, 1652], [1678, AXIS.end - 4]].forEach(([a, b]) =>
    svgEl('line', { class: 'axis', x1: f1(xOfYear(a)), x2: f1(xOfYear(b)), y1: GEO.top - 6, y2: GEO.top - 6 }, g));
}

function drawStrand(svg, row, onPick) {
  const g = svgEl('g', {}, svg);
  const xs = row.dots.map(d => d.x);
  svgEl('line', { class: 'strand', x1: f1(Math.min(...xs)), x2: f1(Math.max(...xs)), y1: row.y, y2: row.y }, g);
  richSpans(svgEl('text', { class: 'title', x: f1(Math.min(...xs) - 5), y: row.y - 11 }, g), row.title);
  if (row.join) svgEl('path', { class: 'strand', d: tailD(Math.max(...xs), row.y, row.join) }, g);
  row.dots.forEach(d => drawDot(g, underLine(row, d), onPick));
}

const tailD = (x, y, j) =>
  `M${f1(x)},${f1(y)} H${f1(j.x - 46)} C${f1(j.x - 20)},${f1(y)} ${f1(j.x - 20)},${f1(j.y)} ${f1(j.x)},${f1(j.y)}`;

// A label hangs centred under its dot; a shared arrangement carries its label to the right.
const underLine = (row, d) => ({ ...d, cy: row.y, lx: d.x, ly: row.y + GEO.labelDy + d.tier * GEO.tierH, anchor: 'middle' });
const besideDot = j => ({ ...j, cy: j.y, lx: j.x + 9, ly: j.y + 4, anchor: 'start' });

function drawDot(parent, d, onPick) {
  const g = svgEl('g', { class: `dot${d.source ? ' source' : ''}`, tabindex: 0, role: 'button',
    'aria-label': `${plainText(d.label)}, ${yearOf(d)}` }, parent);
  const x1 = d.anchor === 'start' ? d.x - 7 : d.lx - d.w / 2 - 3;
  const x2 = d.anchor === 'start' ? d.lx + d.w + 3 : d.lx + d.w / 2 + 3;
  const y1 = Math.min(d.cy - 7, d.ly - 13), y2 = Math.max(d.cy + 7, d.ly + 4);
  svgEl('rect', { class: 'hit', x: f1(x1), y: f1(y1), width: f1(x2 - x1), height: f1(y2 - y1) }, g);
  svgEl('circle', { cx: f1(d.x), cy: f1(d.cy), r: d.source ? 4.2 : 3.6 }, g);
  richSpans(svgEl('text', { x: f1(d.lx), y: f1(d.ly), 'text-anchor': d.anchor }, g), d.label);
  svgEl('title', {}, g).textContent = `${plainText(d.label)}, ${yearOf(d)}`;
  g.addEventListener('click', () => onPick(d, g));
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onPick(d, g); } });
}

function render(layout, onPick) {
  const svg = document.getElementById('chart');
  svg.replaceChildren();
  svg.setAttribute('viewBox', `0 0 ${f1(layout.width)} ${f1(layout.height)}`);
  drawAxis(svg, layout);
  layout.rows.forEach(row => drawStrand(svg, row, onPick));
  layout.joins.forEach(j => drawDot(svg, besideDot(j), onPick));
}

/* ---------- card: only the music and the recordings ---------- */

function entryHtml(e) {
  const links = [...(e.scores ?? []).map(l => ['Noten', ...l]), ...(e.recordings ?? []).map(l => ['Aufnahme', ...l])];
  const list = links.length
    ? `<ul>${links.map(([kind, label, href]) => `<li><span class="kind">${kind} · </span><a href="${escapeHtml(href)}" target="_blank" rel="noopener">${richText(label)}</a></li>`).join('')}</ul>`
    : '<span class="empty">keine Links</span>';
  return `<div class="entry"><p>${richText(e.title)}</p>${list}</div>`;
}

function cardHtml(d) {
  return `<div class="card-head"><h2>${richText(d.label)} <span class="year">${escapeHtml(yearOf(d))}</span></h2>
    <button class="close" id="card-close" aria-label="Schließen">×</button></div>
    ${entriesOf(d).map(entryHtml).join('')}`;
}

function bindCard() {
  const card = document.getElementById('card');
  const close = () => {
    card.hidden = true;
    document.querySelectorAll('.dot.selected').forEach(el => el.classList.remove('selected'));
  };
  card.addEventListener('click', e => { if (e.target.closest('#card-close')) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  return (d, el) => {
    document.querySelectorAll('.dot.selected').forEach(x => x.classList.remove('selected'));
    el.classList.add('selected');
    card.innerHTML = cardHtml(d);
    card.hidden = false;
  };
}

async function start() {
  const measure = await labelMeasure();
  render(layoutAll(measure), bindCard());
}
start();
</script>
